<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Escape Chat - V2</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       ESCAPE CHAT V2 — "Dusk Skyline" design system (unchanged)
       ============================================================ */
    :root {
      --sunset-1: #FF6B4A;
      --sunset-2: #FF8F5C;
      --sunset-3: #6C5CE7;
      --gradient-dusk: linear-gradient(135deg, var(--sunset-1) 0%, var(--sunset-2) 45%, var(--sunset-3) 100%);
      --teal: #14B8A6;
      --danger: #EF4444;

      --paper: #EEF1F5;
      --surface: #FFFFFF;
      --surface-2: #F6F7FA;
      --ink: #171A21;
      --ink-soft: #5B6472;
      --line: #E4E7EC;

      --radius-lg: 26px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --shadow-soft: 0 12px 30px rgba(23, 26, 33, 0.10);
      --shadow-lift: 0 20px 50px rgba(23, 26, 33, 0.16);

      --app-height: 100dvh;
    }

    body.dark-mode {
      --paper: #0C0E13;
      --surface: #171A21;
      --surface-2: #1E212B;
      --ink: #EDEFF3;
      --ink-soft: #9299A8;
      --line: rgba(255,255,255,0.08);
      --shadow-soft: 0 12px 30px rgba(0,0,0,0.35);
      --shadow-lift: 0 24px 60px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; }
    .preload *, .preload *::before, .preload *::after {
      transition: none !important; animation: none !important; will-change: auto !important;
    }

    html { height: 100%; }

    body {
      margin: 0;
      height: var(--app-height);
      min-height: var(--app-height);
      max-height: var(--app-height);
      overflow: hidden;
      position: fixed;
      inset: 0;
      width: 100%;
      background:
        radial-gradient(120% 90% at 15% -10%, rgba(255,107,74,0.16) 0%, transparent 55%),
        radial-gradient(100% 80% at 100% 110%, rgba(108,92,231,0.14) 0%, transparent 55%),
        var(--paper);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--ink);
      transition: background 0.35s ease, color 0.35s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .main-container {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lift);
      overflow: hidden;
      border: 1px solid var(--line);
      width: min(440px, 100%);
      height: min(var(--app-height), 860px);
      max-height: var(--app-height);
      display: flex;
      flex-direction: column;
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    #loginDiv {
      padding: 2.75rem 2.25rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      overflow-y: auto;
    }
    .brand-mark {
      width: 64px; height: 64px;
      border-radius: 20px;
      background: var(--gradient-dusk);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.6rem;
      margin: 0 auto 1.25rem;
      box-shadow: 0 12px 26px rgba(255,107,74,0.35);
    }
    #loginDiv h3 {
      font-family: 'Fraunces', serif;
      font-weight: 600; font-size: 1.7rem;
      letter-spacing: -0.01em; margin-bottom: 0.4rem; color: var(--ink);
    }
    .login-tagline { color: var(--ink-soft); font-size: 0.92rem; margin-bottom: 2rem; }
    #loginDiv .form-control {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 0.98rem;
      color: var(--ink);
    }
    #loginDiv .form-control::placeholder { color: var(--ink-soft); }
    #loginDiv .form-control:focus {
      background: var(--surface);
      border-color: var(--sunset-1);
      box-shadow: 0 0 0 4px rgba(255,107,74,0.12);
    }
    #loginDiv .btn-primary {
      background: var(--gradient-dusk);
      border: none; border-radius: var(--radius-sm);
      padding: 14px; font-weight: 700; letter-spacing: 0.01em;
      box-shadow: 0 10px 22px rgba(255,107,74,0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    #loginDiv .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 14px 26px rgba(255,107,74,0.38); }
    #loginDiv .btn-primary:active { transform: translateY(0) scale(0.98); }
    #loginDiv .btn-outline-secondary {
      border: 1px solid var(--line); color: var(--ink);
      border-radius: var(--radius-sm); padding: 14px;
      font-weight: 600; background: transparent;
    }
    #loginDiv .btn-outline-secondary:hover { background: var(--surface-2); color: var(--ink); border-color: var(--line); }

    #chatDiv { display: flex; flex-direction: column; height: 100%; min-height: 0; }

    /* Chat Header */
    .chat-header {
      background: var(--gradient-dusk);
      color: #fff;
      padding: 14px 18px;
      padding-top: max(14px, env(safe-area-inset-top));
      display: flex; align-items: center; gap: 13px;
      flex: 0 0 auto; position: relative; z-index: 20;
    }
    .back-button {
      background: rgba(255,255,255,0.16);
      border: none; color: #fff; font-size: 1rem;
      cursor: pointer;
      width: 38px; height: 38px; flex: 0 0 auto;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .back-button:hover { background: rgba(255,255,255,0.28); }
    .back-button:active { transform: scale(0.92); }
    .user-avatar {
      width: 42px; height: 42px;
      background: rgba(255,255,255,0.22);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.05rem; font-weight: 700; flex: 0 0 auto;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name {
      font-weight: 700; font-size: 1.02rem; margin-bottom: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .user-status { font-size: 0.8rem; opacity: 0.85; }
    .header-call-buttons { display: flex; gap: 8px; flex: 0 0 auto; }
    .header-call-btn {
      background: rgba(255,255,255,0.16);
      border: none; color: #fff;
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      font-size: 1rem;
    }
    .header-call-btn:hover { background: rgba(255,255,255,0.28); transform: scale(1.06); }
    .header-call-btn:active { transform: scale(0.94); }

    #userListContainer { height: 100%; min-height: 0; display: flex; flex-direction: column; }

    /* V2: search bar */
    .search-bar {
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }
    .search-bar input {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 16px 10px 38px;
      font-size: 0.92rem;
      outline: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B6472' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><path d='m21 21-4.35-4.35'/></svg>");
      background-repeat: no-repeat;
      background-position: 14px center;
      background-size: 15px;
    }
    .search-bar input:focus { border-color: var(--sunset-1); box-shadow: 0 0 0 3px rgba(255,107,74,0.12); }

    #userList {
      flex: 1; min-height: 0; overflow-y: auto;
      background: var(--surface);
      -webkit-overflow-scrolling: touch;
    }
    .user-item {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: background 0.15s ease;
      display: flex; align-items: center; gap: 14px;
    }
    .user-item:hover, .user-item:active { background: var(--surface-2); }
    .user-item-avatar {
      width: 46px; height: 46px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 1.05rem;
      flex: 0 0 auto; background: var(--gradient-dusk);
      position: relative;
    }
    .user-item-avatar .online-dot {
      position: absolute; bottom: 1px; right: 1px;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--teal); border: 2px solid var(--surface);
    }
    .user-item-info { flex: 1; min-width: 0; }
    .user-item-name {
      font-weight: 600; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .user-item-status { font-size: 0.8rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-item-status .fa-circle { font-size: 0.55rem; color: var(--teal) !important; }

    /* V2: unread badge */
    .unread-badge {
      background: var(--gradient-dusk);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      flex: 0 0 auto;
      min-width: 22px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(255,107,74,0.35);
    }

    #chatArea { min-height: 0; }
    #chatBox {
      flex: 1; min-height: 0;
      background: var(--surface-2);
      padding: 16px 14px 6px;
      overflow-y: auto;
      display: flex; flex-direction: column;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      margin: 4px 0;
      padding: 10px 14px;
      border-radius: 18px;
      max-width: 78%;
      word-wrap: break-word; overflow-wrap: break-word;
      position: relative;
      animation: messageAppear 0.25s ease-out;
      font-size: 0.95rem; line-height: 1.4;
      touch-action: pan-y;
      -webkit-user-select: none; user-select: none;
      box-shadow: 0 1px 2px rgba(23,26,33,0.04);
    }
    @keyframes messageAppear {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .sent {
      background: var(--gradient-dusk);
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }
    .received {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      margin-right: auto;
      border-bottom-left-radius: 4px;
      cursor: pointer;
    }
    .received:active { transform: scale(0.99); }

    /* V2: tighten consecutive messages */
    .message.grouped { margin-top: -1px; }

    .message.reply-target { box-shadow: 0 0 0 2px var(--sunset-1), var(--shadow-soft); }

    .message a { color: inherit; text-decoration: underline; }

    .message-time {
      font-size: 0.68rem; opacity: 0.65;
      margin-top: 4px; text-align: right;
      display: flex; align-items: center; justify-content: flex-end; gap: 4px;
    }
    /* V2: read receipt tick */
    .read-tick { font-size: 0.7rem; opacity: 0.75; }

    .date-divider {
      text-align: center; margin: 16px 0;
      color: var(--ink-soft); font-size: 0.72rem;
      font-weight: 600; letter-spacing: 0.03em;
      text-transform: uppercase; position: relative;
    }
    .date-divider::before {
      content: ""; position: absolute; top: 50%; left: 0; right: 0;
      height: 1px; background: var(--line);
    }
    .date-divider span {
      background: var(--surface-2); padding: 0 14px;
      position: relative; z-index: 2;
    }

    .input-area {
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--line);
      flex: 0 0 auto;
    }
    .input-group {
      border-radius: 26px; overflow: hidden;
      background: var(--surface-2);
      display: flex; gap: 6px; align-items: center;
      padding: 4px; border: 1px solid var(--line);
    }
    .form-control {
      border: none; background: transparent;
      padding: 11px 14px; font-size: 0.96rem;
      flex: 1; color: var(--ink); min-width: 0;
    }
    .form-control:focus { box-shadow: none; outline: none; background: transparent; color: var(--ink); }
    .btn-send {
      background: var(--gradient-dusk);
      border: none; width: 42px; height: 42px;
      border-radius: 50%; color: white; font-weight: 600;
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center;
      font-size: 0; transition: transform 0.15s ease;
    }
    .btn-send::before {
      content: "\f1d8";
      font-family: "Font Awesome 6 Free";
      font-weight: 900; font-size: 1rem;
    }
    .btn-send:active { transform: scale(0.9); }

    #replyPreview {
      display: none; padding: 8px 12px;
      border-left: 3px solid var(--sunset-1);
      background: var(--surface-2); color: var(--ink);
      border-radius: var(--radius-sm); margin: 0 2px 8px;
      align-items: center; justify-content: space-between;
      gap: 10px; font-size: 0.85rem;
    }
    #replyPreview .reply-excerpt {
      flex: 1; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; color: var(--ink-soft);
    }
    #replyPreview .reply-cancel {
      background: transparent; border: none; font-size: 1rem;
      cursor: pointer; color: var(--ink-soft); width: 24px; height: 24px;
    }

    .reply-quote {
      border-left: 3px solid rgba(255,255,255,0.55);
      padding: 5px 9px; margin-bottom: 6px;
      font-size: 0.8rem; color: inherit; opacity: 0.85;
      background: rgba(255,255,255,0.12); border-radius: 6px;
    }
    .received .reply-quote {
      border-left-color: var(--sunset-1);
      background: rgba(255,107,74,0.06);
    }

    #typingIndicator {
      font-style: normal; color: var(--ink-soft);
      padding: 8px 14px; font-size: 0.82rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px; margin: 6px 14px;
      align-self: flex-start; max-width: fit-content;
    }
    #typingIndicator .fa-ellipsis-h { color: var(--sunset-1); }

    /* ===== CALL STYLES (unchanged) ===== */
    #callContainer {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(160deg, #14161d 0%, #0a0b0f 100%);
      display: none; justify-content: center; align-items: center;
      z-index: 10000; flex-direction: column;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #callContainer.active { display: flex; }

    #videoContainer { width: 100%; height: 100%; position: relative; overflow: hidden; }
    #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #000; transition: all 0.3s ease; }

    #localVideo {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      right: 20px;
      width: 116px; height: 156px;
      border-radius: 16px;
      border: 2px solid rgba(255,255,255,0.25);
      object-fit: cover; background: #000; cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      z-index: 2;
    }
    #localVideo:hover { transform: scale(1.04); }
    #localVideo.minimized { width: 76px; height: 108px; top: 10px; right: 10px; }

    #callInfoBar {
      position: absolute; top: 0; left: 0; right: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, transparent 100%);
      color: white; padding: 60px 20px 20px;
      padding-top: max(60px, calc(env(safe-area-inset-top) + 30px));
      text-align: center; z-index: 3;
    }
    #callStatus { font-size: 1.25rem; font-weight: 600; margin-bottom: 6px; opacity: 0.95; }
    #callerInfo { font-size: 1.02rem; opacity: 0.75; margin-bottom: 4px; }
    #callDuration { font-size: 0.95rem; opacity: 0.65; font-variant-numeric: tabular-nums; }

    #callControls {
      position: absolute;
      bottom: max(30px, env(safe-area-inset-bottom));
      left: 0; right: 0;
      display: flex; justify-content: center; align-items: center;
      gap: 22px; padding: 0 20px; z-index: 3; flex-wrap: wrap;
    }
    .control-btn {
      width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; border: none; cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
      box-shadow: 0 8px 22px rgba(0,0,0,0.35);
    }
    .control-btn:active { transform: scale(0.92); }
    .control-btn-lg { width: 72px; height: 72px; font-size: 1.6rem; }
    .accept-call { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }
    .decline-call, .end-call { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
    .mute-audio, .mute-video, .speaker-btn, .screen-control-btn {
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(10px);
      color: white;
    }
    .mute-audio.active, .mute-video.active { background: rgba(255,255,255,0.28); }
    .speaker-btn.active { background: var(--gradient-dusk); }
    .screen-control-btn.active { background: rgba(255,255,255,0.35); }

    #connectionStatus {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.75); color: white;
      padding: 20px 30px; border-radius: 20px;
      text-align: center; z-index: 4; display: none;
    }
    #connectionStatus.visible { display: block; }
    .connection-dots { display: flex; justify-content: center; gap: 4px; margin-top: 10px; }
    .connection-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sunset-1); animation: pulse 1.5s infinite; }
    .connection-dot:nth-child(2) { animation-delay: 0.2s; }
    .connection-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .audio-call #remoteVideo, .audio-call #localVideo { display: none; }
    .audio-call #videoContainer {
      background: linear-gradient(160deg, #1a1c25 0%, #0a0b0f 100%);
      display: flex; justify-content: center; align-items: center;
    }
    .audio-avatar {
      width: 140px; height: 140px; border-radius: 50%;
      background: var(--gradient-dusk);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem; color: white;
      margin-bottom: 30px;
      box-shadow: 0 20px 50px rgba(255,107,74,0.35);
    }

    .background-audio-indicator {
      position: absolute; top: 20px; left: 20px;
      background: rgba(0,0,0,0.7); color: white;
      padding: 8px 15px; border-radius: 20px;
      font-size: 0.85rem; z-index: 3; display: none;
    }
    .background-audio-indicator.visible { display: flex; align-items: center; gap: 8px; }

    .screen-off #videoContainer { filter: brightness(0); }
    .screen-off #callInfoBar { opacity: 0.3; }

    @keyframes buttonPulse {
      0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); }
    }
    .pulse { animation: buttonPulse 2s infinite; }

    .call-accepted-banner {
      position: fixed;
      top: max(20px, env(safe-area-inset-top));
      left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white; padding: 13px 26px;
      border-radius: 50px; font-size: 1rem; font-weight: 600;
      box-shadow: 0 10px 30px rgba(34,197,94,0.35);
      z-index: 10001;
      animation: bannerSlide 0.4s ease-out;
    }
    @keyframes bannerSlide { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }

    #toggleTheme {
      background: transparent; border: none;
      font-size: 1.1rem; cursor: pointer;
      transition: transform 0.3s ease;
    }
    #toggleTheme:hover { transform: rotate(25deg); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }

    @media (max-width: 640px) {
      .main-container {
        width: 100%; height: var(--app-height);
        max-height: var(--app-height);
        border-radius: 0; border: none; box-shadow: none;
      }
      .message { max-width: 85%; }
    }
    @media (max-width: 480px) {
      #localVideo { width: 84px; height: 118px; }
      .control-btn { width: 56px; height: 56px; font-size: 1.25rem; }
      .control-btn-lg { width: 66px; height: 66px; }
      #callControls { gap: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body class="preload">

  <div class="main-container">
    <div id="loginDiv">
      <div class="brand-mark"><i class="fas fa-paper-plane"></i></div>
      <h3>Escape Chat</h3>
      <p class="login-tagline">Real conversations, unplugged from the noise.</p>
      <input id="email" type="email" placeholder="Email address" class="form-control mb-3" />
      <input id="password" type="password" placeholder="Password" class="form-control mb-4" />
      <div class="d-grid gap-2">
        <button onclick="login()" class="btn btn-primary btn-lg"><i class="fas fa-sign-in-alt me-2"></i>Log in</button>

  <script>
    /* ============================================================

    const firebaseConfig = {

    /* V2: listener registry — every db.ref().on() we create gets a matching off() */

    /* V2: audio ping for incoming messages */
    let audioCtx = null;
    function pingSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.value = 740;
        g.gain.value = 0.05;
        o.connect(g); g.connect(audioCtx.destination);
        o.start();
        o.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.12);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.18);
        o.stop(audioCtx.currentTime + 0.2);
      } catch (e) { /* silent */ }
    }

    /* V2: unread count in tab title */
    let baseTitle = "Escape Chat - V2";

    function updateTitle() {
      unreadTotal = Object.values(unreadCache).reduce((a, b) => a + b, 0);

        document.title = `(${unreadTotal}) ${baseTitle}`;

    /* ===== Utilities ===== */
    function formatDate(timestamp) {
      const date = new Date(timestamp);
      const today = new Date();
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      if (date.toDateString() === today.toDateString()) return "Today";
      if (date.toDateString() === yesterday.toDateString()) return "Yesterday";
      return date.toLocaleDateString();
    }
    function formatDateTime(timestamp) {
      const date = new Date(timestamp);
      return `${formatDate(timestamp)} ${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
    }
    function timeShort(timestamp) {
      const d = new Date(timestamp);
      const today = new Date();
      if (d.toDateString() === today.toDateString()) {
        return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      }
      const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
      if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    /* V2: two-letter initials from email/name */
    function getInitials(email) {
      if (!email) return '?';
      const local = email.split('@')[0];
      const parts = local.split(/[.\-_\s]+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return local.slice(0, 2).toUpperCase();
    }

    const AVATAR_PALETTE = [
      'linear-gradient(135deg, #FF6B4A, #FF8F5C)',
      'linear-gradient(135deg, #6C5CE7, #8B7CF6)',
      'linear-gradient(135deg, #14B8A6, #2DD4BF)',
      'linear-gradient(135deg, #F59E0B, #FBBF24)',
      'linear-gradient(135deg, #EC4899, #F472B6)',
      'linear-gradient(135deg, #3B82F6, #60A5FA)'
    ];
    function avatarColor(email) {
      let hash = 0;
      const s = email || '';
      for (let i = 0; i < s.length; i++) hash = s.charCodeAt(i) + ((hash << 5) - hash);
      return AVATAR_PALETTE[Math.abs(hash) % AVATAR_PALETTE.length];
    }

    /* V2: auto-link URLs in plain text safely */
    function linkify(text) {
      const urlRe = /(https?:\/\/[^\s]+)/g;
      const parts = text.split(urlRe);
      return parts.map((p, i) => {
        if (i % 2 === 1) {
          const a = document.createElement('a');
          a.href = p;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = p;
          return a;
        }
        return document.createTextNode(p);
      });
    }

    function showCallAcceptedBanner() {
      const banner = document.createElement('div');
      banner.className = 'call-accepted-banner';

    /* ===== Navigation ===== */
    function showUserList() {
      document.getElementById('chatHeader').style.display = 'none';

      document.getElementById('chatArea').style.display = 'none';

    function showChatArea(userId, userEmail, userStatus) {

      document.getElementById('headerUserName').textContent = userEmail;

      document.getElementById('chatArea').style.display = 'flex';

      setTimeout(() => {
        const chatBox = document.getElementById('chatBox');
        if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
        const msgInput = document.getElementById('messageInput');
        if (msgInput) msgInput.focus();
      }, 80);

      /* V2: clear unread badge for this user */
      if (unreadCache[userId]) {
        unreadCache[userId] = 0;
        updateTitle();
        renderUserList();
      }

      startChatWith(userId);
    }

    function startVideoCall() { if (selectedUserId) initiateCall(selectedUserId, false); }
    function startAudioCall() { if (selectedUserId) initiateCall(selectedUserId, true); }

    window.addEventListener('DOMContentLoaded', () => {
      const removePreload = () => document.body.classList.remove('preload');
      if (window.requestAnimationFrame) {
        requestAnimationFrame(() => requestAnimationFrame(removePreload));
        setTimeout(removePreload, 250);
      } else setTimeout(removePreload, 60);
    });

    /* ===== Reply state ===== */
    function setReply(messageId, senderId, text, senderEmail) {
      replyTo = { messageId, senderId, text, senderEmail };
      const preview = document.getElementById('replyPreview');
      document.getElementById('replyExcerpt').textContent =
        text.length > 120 ? text.slice(0, 117) + '...' : text;
      preview.style.display = 'flex';
      document.getElementById('messageInput').focus();
    }
    function cancelReply() {
      replyTo = null;
      document.getElementById('replyPreview').style.display = 'none';
      document.getElementById('replyExcerpt').textContent = '';
    }
    document.getElementById('cancelReplyBtn').addEventListener('click', cancelReply);

    /* ============================================================
       CALLING (preserved + hardened)
       ============================================================ */
    let currentCallId = null;
    let localStream = null;
    let remoteStream = null;
    let peerConnection = null;
    let isCaller = false;
    let isAudioCall = false;
    let isAudioMuted = false;
    let isVideoMuted = false;
    let isSpeakerOn = false;
    let isScreenOn = true;
    let callStartTime = null;
    let callDurationInterval = null;
    let connectionTimeout = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECT_ATTEMPTS = 3;
    let pendingOffer = null;

    /* V2: track refs so we can fully detach on endCall */
    let callRefs = [];
    function trackCallRef(ref) { callRefs.push(ref); return ref; }
    function detachCallRefs() {
      callRefs.forEach(r => r.off());
      callRefs = [];
    }

    const configuration = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' },
        { urls: 'stun:stun4.l.google.com:19302' },
        { urls: 'turn:numb.viagenie.ca', credential: 'muazkh', username: 'webrtc@live.com' },
        { urls: 'turn:openrelay.metered.ca:80', credential: 'openrelayproject', username: 'openrelayproject' }
      ],
      iceCandidatePoolSize: 10,
      bundlePolicy: 'max-bundle',
      rtcpMuxPolicy: 'require'
    };

    async function createPeerConnection() {
      peerConnection = new RTCPeerConnection(configuration);

      peerConnection.onconnectionstatechange = () => {
        const state = peerConnection.connectionState;
        updateConnectionStatus(state);
        if (state === 'connected') onCallConnected();
        else if (state === 'disconnected') attemptReconnection();
        else if (state === 'failed') onCallFailed();
        else if (state === 'closed') onCallClosed();
      };
      peerConnection.oniceconnectionstatechange = () => {
        console.log('ICE:', peerConnection.iceConnectionState);
      };
      peerConnection.onicecandidate = (event) => {
        if (event.candidate && currentCallId) {
          db.ref(`calls/${currentCallId}/candidates/${currentUserId}`)
            .push(event.candidate.toJSON())
            .catch(err => console.warn('ICE send failed:', err));
        }
      };
      peerConnection.ontrack = (event) => {
        remoteStream = event.streams[0];
        document.getElementById('remoteVideo').srcObject = remoteStream;
      };

      if (localStream) {
        localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
      }
      return peerConnection;
    }

    function updateConnectionStatus(state) {
      const statusEl = document.getElementById('callStatus');
      const connEl = document.getElementById('connectionStatus');
      switch (state) {
        case 'connecting':
          statusEl.textContent = 'Connecting...';
          connEl.style.display = 'block';
          break;
        case 'connected':
          statusEl.textContent = 'Connected';
          connEl.style.display = 'none';
          break;
        case 'disconnected':
          statusEl.textContent = 'Reconnecting...';
          connEl.style.display = 'block';
          break;
        case 'failed':
          statusEl.textContent = 'Connection Failed';
          connEl.style.display = 'block';
          break;
        default: statusEl.textContent = state;
      }
    }

    function attemptReconnection() {
      if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
        reconnectAttempts++;
        setTimeout(() => {
          if (peerConnection && peerConnection.connectionState === 'disconnected') restartIce();
        }, 2000 * reconnectAttempts);
      } else onCallFailed();
    }

    async function restartIce() {
      try {
        if (isCaller) {
          const offer = await peerConnection.createOffer({ iceRestart: true });
          await peerConnection.setLocalDescription(offer);
          await db.ref(`calls/${currentCallId}/offer`).set(offer);
        }
      } catch (e) { console.error('ICE restart failed:', e); }
    }

    async function setupMediaStream(audioOnly = false) {
      const constraints = {
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        video: audioOnly ? false : {
          width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 }
        }
      };
      localStream = await navigator.mediaDevices.getUserMedia(constraints);
      document.getElementById('localVideo').srcObject = localStream;
      return localStream;
    }

    async function toggleSpeaker() {
      try {
        if (!('setSinkId' in HTMLMediaElement.prototype)) {
          alert('Speaker control is not supported in this browser.');
          return;
        }
        const remoteVideo = document.getElementById('remoteVideo');
        if (isSpeakerOn) {
          await remoteVideo.setSinkId('').catch(() => remoteVideo.setSinkId('default'));
          document.getElementById('speakerBtn').classList.remove('active');
          document.getElementById('speakerBtn').innerHTML = '<i class="fas fa-volume-up"></i>';
          isSpeakerOn = false;
        } else {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const speakers = devices.filter(d => d.kind === 'audiooutput');
          if (speakers.length > 0 && speakers[0].deviceId) {
            await remoteVideo.setSinkId(speakers[0].deviceId);
          } else {
            await remoteVideo.setSinkId('default');
          }
          document.getElementById('speakerBtn').classList.add('active');
          document.getElementById('speakerBtn').innerHTML = '<i class="fas fa-volume-down"></i>';
          isSpeakerOn = true;
        }
      } catch (e) { console.error('Speaker toggle:', e); }
    }

    function toggleScreen() {
      isScreenOn = !isScreenOn;
      const btn = document.getElementById('screenControlBtn');
      const c = document.getElementById('callContainer');
      if (isScreenOn) {
        c.classList.remove('screen-off');
        btn.innerHTML = '<i class="fas fa-mobile-screen"></i>';
        btn.classList.remove('active');
      } else {
        c.classList.add('screen-off');
        btn.innerHTML = '<i class="fas fa-mobile"></i>';
        btn.classList.add('active');
      }
    }

    async function initiateCall(otherUserId, audioOnly = false) {
      if (callInProgress) { alert('You already have an active call.'); return; }
      try {
        isCaller = true;
        isAudioCall = audioOnly;
        currentCallId = `${currentUserId}_${otherUserId}_${Date.now()}`;
        callInProgress = true;
        reconnectAttempts = 0;
        callRefs = [];

        showCallInterface('outgoing', audioOnly);
        document.getElementById('callerInfo').textContent = 'Calling...';

        await setupMediaStream(audioOnly);
        await createPeerConnection();

        isSpeakerOn = false;
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await db.ref(`calls/${currentCallId}`).set({
          callerId: currentUserId,
          receiverId: otherUserId,
          status: 'calling',
          isAudioCall: audioOnly,
          offer: offer,
          timestamp: Date.now()
        });

        connectionTimeout = setTimeout(() => {
          if (peerConnection.connectionState !== 'connected') onCallFailed();
        }, 30000);

        /* V2: use once for answer; use tracked refs for candidates/status */
        const answerRef = trackCallRef(db.ref(`calls/${currentCallId}/answer`));
        answerRef.once('value', snap => {
          const ans = snap.val();
          if (ans && peerConnection && !peerConnection.currentRemoteDescription) {
            peerConnection.setRemoteDescription(new RTCSessionDescription(ans));
          }
        });
        // still listen in case answer arrives after this point:
        answerRef.on('value', async (snap) => {
          const ans = snap.val();
          if (ans && peerConnection && !peerConnection.currentRemoteDescription) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(ans));
          }
        });

        trackCallRef(db.ref(`calls/${currentCallId}/candidates/${otherUserId}`))
          .on('child_added', handleRemoteCandidate);
        trackCallRef(db.ref(`calls/${currentCallId}/status`))
          .on('value', handleCallStatusChange);

      } catch (err) {
        console.error('initiateCall:', err);
        alert('Failed to start call: ' + err.message);
        endCall();
      }
    }

    async function handleRemoteCandidate(snapshot) {
      const data = snapshot.val();
      if (data && peerConnection && peerConnection.remoteDescription) {
        try { await peerConnection.addIceCandidate(new RTCIceCandidate(data)); }
        catch (e) { console.warn('ICE add:', e); }
      }
    }

    function handleCallStatusChange(snapshot) {
      const status = snapshot.val();
      if (status === 'ended' && callInProgress) {
        document.getElementById('callStatus').textContent = 'Call Ended';
        setTimeout(endCall, 2000);
      } else if (status === 'declined' && callInProgress && isCaller) {
        document.getElementById('callStatus').textContent = 'Call Declined';
        setTimeout(endCall, 2000);
      }
    }

    function handleIncomingCall(callId, callData) {
      const parts = callId.split('_');
      if (parts.length < 3 || parts[0] !== callData.callerId) {
        db.ref(`calls/${callId}/status`).set('invalid_format');
        return;
      }
      if (callInProgress) {
        db.ref(`calls/${callId}/status`).set('declined');
        return;
      }
      currentCallId = callId;
      callInProgress = true;
      isCaller = false;
      isAudioCall = !!callData.isAudioCall;
      callRefs = [];

      showCallInterface('incoming', isAudioCall);

      db.ref(`users/${callData.callerId}`).once('value', snap => {
        const u = snap.val();
        if (u) document.getElementById('callerInfo').textContent = u.email;
      });

      pendingOffer = callData.offer;
      trackCallRef(db.ref(`calls/${currentCallId}/status`))
        .on('value', handleCallStatusChange);
    }

    function showCallInterface(type, audioOnly) {
      const c = document.getElementById('callContainer');
      const acceptBtn = document.getElementById('acceptCall');
      const declineBtn = document.getElementById('declineCall');
      const endBtn = document.getElementById('endCall');
      const muteAudioBtn = document.getElementById('muteAudio');
      const muteVideoBtn = document.getElementById('muteVideo');
      const speakerBtn = document.getElementById('speakerBtn');
      const screenBtn = document.getElementById('screenControlBtn');

      c.classList.add('active');
      if (audioOnly) {
        c.classList.add('audio-call');
        document.querySelector('.audio-avatar').style.display = 'flex';
      } else {
        c.classList.remove('audio-call');
        document.querySelector('.audio-avatar').style.display = 'none';
      }

      switch (type) {
        case 'incoming':
          acceptBtn.style.display = 'flex';
          declineBtn.style.display = 'flex';
          endBtn.style.display = 'none';
          muteAudioBtn.style.display = 'none';
          muteVideoBtn.style.display = 'none';
          speakerBtn.style.display = 'none';
          screenBtn.style.display = 'none';
          document.getElementById('callStatus').textContent = 'Incoming Call';
          break;
        case 'outgoing':
          acceptBtn.style.display = 'none';
          declineBtn.style.display = 'none';
          endBtn.style.display = 'flex';
          muteAudioBtn.style.display = 'flex';
          muteVideoBtn.style.display = !audioOnly ? 'flex' : 'none';
          speakerBtn.style.display = 'flex';
          screenBtn.style.display = 'flex';
          document.getElementById('callStatus').textContent = 'Calling...';
          break;
        case 'active':
          acceptBtn.style.display = 'none';
          declineBtn.style.display = 'none';
          endBtn.style.display = 'flex';
          muteAudioBtn.style.display = 'flex';
          muteVideoBtn.style.display = !audioOnly ? 'flex' : 'none';
          speakerBtn.style.display = 'flex';
          screenBtn.style.display = 'flex';
          startCallTimer();
          break;
      }
    }

    function startCallTimer() {
      document.getElementById('callDuration').textContent = '00:00';
      callStartTime = Date.now();
      if (callDurationInterval) clearInterval(callDurationInterval);
      callDurationInterval = setInterval(() => {
        const s = Math.floor((Date.now() - callStartTime) / 1000);
        const m = Math.floor(s / 60);
        document.getElementById('callDuration').textContent =
          `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
      }, 1000);
    }

    function onCallConnected() {
      showCallInterface('active', isAudioCall);
      showCallAcceptedBanner();
      reconnectAttempts = 0;
    }
    function onCallFailed() { alert('Call failed to connect. Please try again.'); endCall(); }
    function onCallClosed() { /* handled in endCall */ }

    function endCall() {
      if (callDurationInterval) { clearInterval(callDurationInterval); callDurationInterval = null; }
      if (connectionTimeout) { clearTimeout(connectionTimeout); connectionTimeout = null; }

      if (currentCallId) {
        db.ref(`calls/${currentCallId}/status`).set('ended').catch(() => {});
        const idToRemove = currentCallId;
        setTimeout(() => db.ref(`calls/${idToRemove}`).remove().catch(() => {}), 5000);
      }
      detachCallRefs();   // V2: cleanly off() every call listener
      currentCallId = null;

      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      if (remoteStream) { remoteStream.getTracks().forEach(t => t.stop()); remoteStream = null; }
      if (peerConnection) { try { peerConnection.close(); } catch(e){} peerConnection = null; }

      callInProgress = false;
      isCaller = false;
      isAudioCall = false;
      reconnectAttempts = 0;
      pendingOffer = null;
      isAudioMuted = false;
      isVideoMuted = false;
      isSpeakerOn = false;
      isScreenOn = true;
      callStartTime = null;

      const c = document.getElementById('callContainer');
      c.classList.remove('active');
      c.classList.remove('screen-off');
      document.querySelector('.background-audio-indicator').classList.remove('visible');

      document.getElementById('muteAudio').innerHTML = '<i class="fas fa-microphone"></i>';
      document.getElementById('muteVideo').innerHTML = '<i class="fas fa-video"></i>';
      document.getElementById('speakerBtn').classList.remove('active');
      document.getElementById('speakerBtn').innerHTML = '<i class="fas fa-volume-up"></i>';
      document.getElementById('screenControlBtn').classList.remove('active');

      document.getElementById('callDuration').textContent = '00:00';
      document.getElementById('callStatus').textContent = 'Connecting...';
      document.getElementById('callerInfo').textContent = 'User';
    }

    function toggleAudio() {
      if (localStream) {
        localStream.getAudioTracks().forEach(t => t.enabled = !t.enabled);
        isAudioMuted = !isAudioMuted;
        const b = document.getElementById('muteAudio');
        b.innerHTML = isAudioMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
        b.classList.toggle('active', isAudioMuted);
      }
    }
    function toggleVideo() {
      if (localStream && !isAudioCall) {
        localStream.getVideoTracks().forEach(t => t.enabled = !t.enabled);
        isVideoMuted = !isVideoMuted;
        const b = document.getElementById('muteVideo');
        b.innerHTML = isVideoMuted ? '<i class="fas fa-video-slash"></i>' : '<i class="fas fa-video"></i>';
        b.classList.toggle('active', isVideoMuted);
        document.getElementById('localVideo').style.display = isVideoMuted ? 'none' : 'block';
      }
    }

    document.getElementById('acceptCall').addEventListener('click', acceptIncomingCall);
    document.getElementById('declineCall').addEventListener('click', declineIncomingCall);
    document.getElementById('endCall').addEventListener('click', endCall);
    document.getElementById('muteAudio').addEventListener('click', toggleAudio);
    document.getElementById('muteVideo').addEventListener('click', toggleVideo);
    document.getElementById('speakerBtn').addEventListener('click', toggleSpeaker);
    document.getElementById('screenControlBtn').addEventListener('click', toggleScreen);
    document.getElementById('localVideo').addEventListener('click', function () {
      this.classList.toggle('minimized');
    });

    /* V2: ESC ends / declines active call */
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!callInProgress) return;
      const accept = document.getElementById('acceptCall');
      if (accept.style.display !== 'none') declineIncomingCall();
      else endCall();
    });

    async function acceptIncomingCall() {
      try {
        if (!pendingOffer) throw new Error('No offer received');
        db.ref(`calls/${currentCallId}/status`).set('accepted');
        showCallInterface('active', isAudioCall);

        await setupMediaStream(isAudioCall);
        await createPeerConnection();

        isSpeakerOn = false;
        await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        await db.ref(`calls/${currentCallId}/answer`).set({ ...answer, from: currentUserId });

        const callerId = currentCallId.split('_')[0];
        trackCallRef(db.ref(`calls/${currentCallId}/candidates/${callerId}`))
          .on('child_added', handleRemoteCandidate);
      } catch (e) {
        console.error('acceptIncomingCall:', e);
        alert('Error accepting call: ' + e.message);
        endCall();
      }
    }

    function declineIncomingCall() {
      if (currentCallId) db.ref(`calls/${currentCallId}/status`).set('declined');
      document.getElementById('callStatus').textContent = 'Call Declined';
      setTimeout(endCall, 1500);
    }

    function listenForCalls() {
      db.ref('calls').on('child_added', (snapshot) => {
        const callId = snapshot.key;
        const data = snapshot.val();
        if (!data) return;
        if (data.receiverId === currentUserId &&
            data.callerId !== currentUserId &&
            data.status === 'calling' &&
            !callInProgress) {
          handleIncomingCall(callId, data);
        }
      });
    }

    /* V2: only clear calls older than an hour, not the whole node */
    function clearOldCalls() {
      const oneHourAgo = Date.now() - 3600000;
      db.ref('calls').once('value').then(snap => {
        const calls = snap.val() || {};
        Object.entries(calls).forEach(([id, c]) => {
          if (c.status === 'ended' || (c.timestamp && c.timestamp < oneHourAgo)) {
            db.ref(`calls/${id}`).remove();
          }
        });
      });
    }

    /* ============================================================
       AUTH
       ============================================================ */
    function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(email, password).catch(e => alert(e.message));
    }
    function register() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      auth.createUserWithEmailAndPassword(email, password)
        .then(user => db.ref('users/' + user.user.uid).set({ email, online: true, createdAt: Date.now() }))
        .catch(e => {
          if (e.code === 'auth/email-already-in-use') alert('This email is already registered. Please login.');
          else alert(e.message);
        });
    }

    /* ============================================================
       USER LIST — V2 (search, last message, unread badges, live presence)
       ============================================================ */
    function renderUserList() {
      const list = document.getElementById('userList');
      list.innerHTML = '';
      const filter = userListFilter.toLowerCase();
      const entries = Object.entries(usersCache)
        .filter(([uid]) => uid !== currentUserId)
        .filter(([uid, u]) => !filter || (u.email || '').toLowerCase().includes(filter));

      /* V2: sort by last message time, then by email */
      entries.sort((a, b) => {
        const ta = lastMsgCache[a[0]]?.timestamp || 0;
        const tb = lastMsgCache[b[0]]?.timestamp || 0;
        return tb - ta;
      });

      if (entries.length === 0) {
        list.innerHTML = "<div class='user-item text-muted'>No users found.</div>";
        return;
      }

      entries.forEach(([uid, userData]) => {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.onclick = () => {
          const status = userData.online
            ? '<i class="fas fa-circle text-success me-1"></i>Online'
            : `Last seen ${userData.lastOnline ? formatDateTime(userData.lastOnline) : 'a long time ago'}`;
          showChatArea(uid, userData.email, status);
        };

        const avatar = document.createElement('div');
        avatar.className = 'user-item-avatar';
        avatar.textContent = getInitials(userData.email);
        avatar.style.background = avatarColor(userData.email);
        if (userData.online) {
          const dot = document.createElement('span');
          dot.className = 'online-dot';
          avatar.appendChild(dot);
        }

        const info = document.createElement('div');
        info.className = 'user-item-info';

        const name = document.createElement('div');
        name.className = 'user-item-name';
        name.textContent = userData.email;

        const status = document.createElement('div');
        status.className = 'user-item-status';

        const last = lastMsgCache[uid];
        if (last) {
          const who = last.fromSelf ? 'You: ' : '';
          status.textContent = `${who}${last.text}`;
        } else if (userData.online) {
          status.innerHTML = '<i class="fas fa-circle text-success me-1"></i>Online';
        } else if (userData.lastOnline) {
          status.textContent = `Last seen ${formatDateTime(userData.lastOnline)}`;
        } else {
          status.textContent = 'Offline';
        }

        info.appendChild(name);
        info.appendChild(status);
        div.appendChild(avatar);
        div.appendChild(info);

        /* V2: unread badge + time on the right */
        const rightCol = document.createElement('div');
        rightCol.style.display = 'flex';
        rightCol.style.flexDirection = 'column';
        rightCol.style.alignItems = 'flex-end';
        rightCol.style.gap = '4px';

        const timeEl = document.createElement('div');
        timeEl.style.fontSize = '0.72rem';
        timeEl.style.color = 'var(--ink-soft)';
        timeEl.textContent = last ? timeShort(last.timestamp) : '';
        rightCol.appendChild(timeEl);

        if (unreadCache[uid] > 0) {
          const badge = document.createElement('div');
          badge.className = 'unread-badge';
          badge.textContent = unreadCache[uid] > 99 ? '99+' : unreadCache[uid];
          rightCol.appendChild(badge);
        } else {
          rightCol.appendChild(document.createElement('div')); // spacer for alignment
        }
        div.appendChild(rightCol);

        list.appendChild(div);
      });
    }

    function loadUsers() {
      document.getElementById('userList').innerHTML =
        "<div class='user-item text-muted'>Loading users...</div>";

      db.ref('users').on('value', snapshot => {
        const users = snapshot.val() || {};
        /* refresh cache */
        Object.keys(users).forEach(uid => usersCache[uid] = users[uid]);
        Object.keys(usersCache).forEach(uid => { if (!users[uid]) delete usersCache[uid]; });
        renderUserList();
      });

      /* V2: subscribe to last message of every conversation involving current user.
         We keep it cheap by listening to /chats once and picking per-peer nodes. */
      db.ref('chats').on('value', snapshot => {
        const chats = snapshot.val() || {};
        const prevUnread = { ...unreadCache };
        Object.keys(lastMsgCache).forEach(k => delete lastMsgCache[k]);
        Object.keys(unreadCache).forEach(k => delete unreadCache[k]);

        Object.entries(chats).forEach(([cid, chatData]) => {
          if (!cid.includes(currentUserId)) return;
          const parts = cid.split('_');
          const other = parts[0] === currentUserId ? parts[1] : parts[0];
          const msgs = chatData.messages;
          if (!msgs) return;
          const msgArr = Object.entries(msgs).sort(
            (a, b) => (a[1].timestamp || 0) - (b[1].timestamp || 0)
          );
          const last = msgArr[msgArr.length - 1];
          if (!last) return;

          const [, m] = last;
          lastMsgCache[other] = {
            text: m.senderId === currentUserId ? m.text : m.text,
            timestamp: m.timestamp || 0,
            fromSelf: m.senderId === currentUserId
          };

          /* V2: count unread — messages from other user not in readBy */
          if (selectedUserId === other) {
            unreadCache[other] = 0;
          } else {
            let count = 0;
            msgArr.forEach(([, m]) => {
              if (m.senderId !== currentUserId && !(m.readBy && m.readBy[currentUserId])) count++;
            });
            unreadCache[other] = count;
          }
        });

        updateTitle();
        renderUserList();
      });
    }

    /* V2: search input handler */
    document.getElementById('userSearchInput').addEventListener('input', (e) => {
      userListFilter = e.target.value.trim();
      renderUserList();
    });

    /* ============================================================
       CHAT — V2 (grouping, read receipts, linkify, listener teardown)
       ============================================================ */
    let lastRenderInfo = { senderId: null, dateKey: null };

    function startChatWith(otherUserId) {
      chatId = currentUserId < otherUserId
        ? `${currentUserId}_${otherUserId}`
        : `${otherUserId}_${currentUserId}`;

      clearChatListeners();
      document.getElementById('chatBox').innerHTML = '';
      lastRenderInfo = { senderId: null, dateKey: null };

      /* Presence listener for header */
      const userRef = db.ref(`users/${otherUserId}`);
      registerListener(userRef, 'value', snapshot => {
        const data = snapshot.val();
        if (!data) return;
        let statusText = 'Offline';
        if (data.online) statusText = '<i class="fas fa-circle text-success me-1"></i>Online';
        else if (data.lastOnline) statusText = `Last seen ${formatDateTime(data.lastOnline)}`;
        document.getElementById('headerUserStatus').innerHTML = statusText;
      });

      /* Typing listener */
      const typingRef = db.ref(`chats/${chatId}/typing`);
      registerListener(typingRef, 'value', snapshot => {
        const td = snapshot.val() || {};
        const otherTyping = Object.entries(td)
          .some(([uid, isTyping]) => uid !== currentUserId && isTyping);
        document.getElementById('typingIndicator').style.display = otherTyping ? 'block' : 'none';
      });

      /* Message listener */
      const msgsRef = db.ref(`chats/${chatId}/messages`);
      registerListener(msgsRef, 'child_added', snapshot => {
        const msg = snapshot.val();
        const msgId = snapshot.key;
        renderMessage(msgId, msg);

        /* mark as read by me */
        db.ref(`chats/${chatId}/messages/${msgId}/readBy/${currentUserId}`).set(true);

        /* V2: sound ping + title if it's from the other user */
        if (msg.senderId !== currentUserId) {
          if (document.hidden) pingSound();
        }
      });

      /* V2: watch readBy changes on my last sent message to update ✓✓ */
      registerListener(msgsRef, 'child_changed', snapshot => {
        const msg = snapshot.val();
        if (!msg) return;
        if (msg.senderId === currentUserId) updateReadTick(snapshot.key, msg);
      });
    }

    function renderMessage(msgId, msg) {
      const msgDate = formatDate(msg.timestamp);
      const chatBox = document.getElementById('chatBox');

      /* Date divider */
      if (msgDate !== lastRenderInfo.dateKey) {
        const dateDivider = document.createElement('div');
        dateDivider.className = 'date-divider';
        dateDivider.innerHTML = `<span>${msgDate}</span>`;
        chatBox.appendChild(dateDivider);
        lastRenderInfo.dateKey = msgDate;
        lastRenderInfo.senderId = null;
      }

      const div = document.createElement('div');
      const isSent = msg.senderId === currentUserId;
      div.className = 'message ' + (isSent ? 'sent' : 'received');
      div.dataset.msgId = msgId;

      /* V2: group consecutive messages from same sender */
      if (lastRenderInfo.senderId === msg.senderId) div.classList.add('grouped');
      lastRenderInfo.senderId = msg.senderId;

      if (msg.replyTo && msg.replyTo.text) {
        const quote = document.createElement('div');
        quote.className = 'reply-quote';
        const who = msg.replyTo.senderEmail ? msg.replyTo.senderEmail.split('@')[0] : 'User';
        quote.textContent = `${who}: ${msg.replyTo.text}`;
        div.appendChild(quote);
      }

      const textDiv = document.createElement('div');
      textDiv.className = 'message-text';
      linkify(msg.text).forEach(node => textDiv.appendChild(node));

      const timeDiv = document.createElement('div');
      timeDiv.className = 'message-time';
      const timeText = document.createElement('span');
      timeText.textContent = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      timeDiv.appendChild(timeText);

      /* V2: read receipt ticks on sent messages */
      if (isSent) {
        const tick = document.createElement('span');
        tick.className = 'read-tick';
        tick.dataset.msgId = msgId;
        tick.innerHTML = msg.readBy && Object.keys(msg.readBy).some(uid => uid !== currentUserId)
          ? '<i class="fas fa-check-double" style="color:#BFE9FF;"></i>'
          : '<i class="fas fa-check"></i>';
        timeDiv.appendChild(tick);
      }

      div.appendChild(textDiv);
      div.appendChild(timeDiv);

      /* V2: tap (mobile) or long-press to reply */
      if (!isSent) {
        div.addEventListener('click', () => {
          document.querySelectorAll('.message.reply-target').forEach(el => el.classList.remove('reply-target'));
          div.classList.add('reply-target');
          setReply(msgId, msg.senderId, msg.text, msg.senderEmail || 'User');
          setTimeout(() => div.classList.remove('reply-target'), 1400);
        });
      }

      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    /* V2: update tick on a sent message when readBy changes */
    function updateReadTick(msgId, msg) {
      const tick = document.querySelector(`.read-tick[data-msg-id="${msgId}"]`);
      if (!tick) return;
      const readByOther = msg.readBy && Object.keys(msg.readBy).some(uid => uid !== currentUserId);
      tick.innerHTML = readByOther
        ? '<i class="fas fa-check-double" style="color:#BFE9FF;"></i>'
        : '<i class="fas fa-check"></i>';
    }

    function sendMessage() {
      if (!selectedUserId) { alert('Please select a user to chat with.'); return; }
      const text = document.getElementById('messageInput').value.trim();
      if (!text) return;

      const payload = {
        text,
        senderId: currentUserId,
        senderEmail: auth.currentUser ? auth.currentUser.email : null,
        timestamp: Date.now(),
        readBy: { [currentUserId]: true }
      };
      if (replyTo) {
        payload.replyTo = {
          messageId: replyTo.messageId,
          senderId: replyTo.senderId,
          senderEmail: replyTo.senderEmail,
          text: replyTo.text
        };
      }
      db.ref(`chats/${chatId}/messages`).push(payload);
      document.getElementById('messageInput').value = '';
      cancelReply();
      /* clear typing indicator */
      db.ref(`chats/${chatId}/typing/${currentUserId}`).set(false);
    }

    /* V2: throttle typing writes to avoid DB spam */
    let typingThrottle = null;
    document.getElementById('messageInput').addEventListener('input', () => {
      if (!chatId) return;
      if (typingThrottle) return;
      typingThrottle = setTimeout(() => typingThrottle = null, 400);
      const isTyping = document.getElementById('messageInput').value.trim().length > 0;
      db.ref(`chats/${chatId}/typing/${currentUserId}`).set(isTyping);
    });
    document.getElementById('messageInput').addEventListener('blur', () => {
      if (chatId) db.ref(`chats/${chatId}/typing/${currentUserId}`).set(false);
    });
    document.getElementById('messageInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

    /* ============================================================
       THEME — V2 (persisted)
       ============================================================ */
    const themeBtn = document.getElementById('toggleTheme');
    function applyTheme(dark) {
      document.body.classList.toggle('dark-mode', dark);
      themeBtn.textContent = dark ? '☀️' : '🌙';
    }
    applyTheme(localStorage.getItem('escape-theme') === 'dark');
    themeBtn.addEventListener('click', () => {
      const dark = !document.body.classList.contains('dark-mode');
      applyTheme(dark);
      localStorage.setItem('escape-theme', dark ? 'dark' : 'light');
    });

    /* ============================================================
       AUTH STATE
       ============================================================ */
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUserId = user.uid;
        currentUserEmail = user.email;
        db.ref(`users/${currentUserId}`).update({
          email: user.email,
          online: true
        });
        db.ref(`users/${currentUserId}`).onDisconnect().update({
          online: false,
          lastOnline: firebase.database.ServerValue.TIMESTAMP
        });

        loadUsers();
        listenForCalls();
        clearOldCalls();

        document.getElementById('loginDiv').style.display = 'none';
        document.getElementById('chatDiv').style.display = 'flex';
      } else {
        currentUserId = null;
        currentUserEmail = null;
        clearChatListeners();
        document.getElementById('loginDiv').style.display = 'block';
        document.getElementById('chatDiv').style.display = 'none';
      }
    });

    /* V2: restore title when tab becomes visible */
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) updateTitle();
    });

    /* ============================================================
       Mobile keyboard / viewport handling (unchanged, still works)
       ============================================================ */
    (function () {
      const root = document.documentElement;
      function setAppHeight() {
        const vv = window.visualViewport;
        const height = vv ? vv.height : window.innerHeight;
        root.style.setProperty('--app-height', height + 'px');
        const chatBox = document.getElementById('chatBox');
        if (chatBox && document.getElementById('chatArea').style.display !== 'none') {
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      }
      setAppHeight();
      window.addEventListener('load', setAppHeight);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', setAppHeight);
        window.visualViewport.addEventListener('scroll', setAppHeight);
      } else {
        window.addEventListener('resize', setAppHeight);
      }
      window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 100));
      document.addEventListener('focusin', e => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
          setTimeout(setAppHeight, 50);
          setTimeout(setAppHeight, 300);
        }
      });
      document.addEventListener('focusout', () => setTimeout(setAppHeight, 100));
    })();
  </script>
</body>
</html>
